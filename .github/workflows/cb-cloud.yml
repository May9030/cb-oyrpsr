name: cb-cloud
on:
 schedule:
    - cron: '*/10 0-8 * * 1-5'
  workflow_dispatch: {}
permissions:
  contents: write
env:
  TZ: Asia/Shanghai
  CB_DASH_FILE: index.html
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch and render
        shell: pwsh
        run: ./tracker.ps1
      - name: commit and push
        shell: bash
        run: |
          git config user.name "cb-bot"
          git config user.email "cb-bot@users.noreply.github.com"
          git pull --rebase --autostash || true
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "cloud update $(TZ=Asia/Shanghai date '+%F %T')"
            git push
          fi
